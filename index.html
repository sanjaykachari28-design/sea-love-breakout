<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Sea Love Breakout</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#061722;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

body{
    display:flex;
    justify-content:center;
}

.page{
    width:100%;
    max-width:1180px;
    padding:18px 14px 25px;
}

/* BRAND */

.brand{
    font-size:clamp(24px,3vw,36px);
    font-weight:900;
    letter-spacing:-1px;
    margin-bottom:8px;
}

.brand span{
    color:#12c8ee;
}

.subtitle{
    color:#9fc1d0;
    font-size:14px;
    margin:0 0 14px;
}

/* GAME */

.game-container{
    width:100%;
    max-width:1080px;
    margin:auto;
}

.game{
    position:relative;
    width:100%;
    overflow:hidden;
    border-radius:18px;
    border:1px solid #16657e;
    background:#03141f;
    box-shadow:0 15px 45px rgba(0,0,0,.4);
}

canvas{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:16 / 9;
    background:#052331;
    touch-action:none;
}

/* HUD */

.hud{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;

    display:flex;
    justify-content:space-between;

    pointer-events:none;
}

.hud-item{
    background:rgba(0,20,30,.8);
    border:1px solid rgba(80,210,235,.2);
    border-radius:30px;

    padding:7px 13px;

    font-size:clamp(12px,1.6vw,18px);
    font-weight:bold;
}

/* GAME OVER */

.overlay{
    position:absolute;
    inset:0;

    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(0,10,18,.75);
}

.overlay.show{
    display:flex;
}

.card{
    width:min(440px,90%);
    padding:25px 20px;

    text-align:center;

    background:#092536;
    border:1px solid #19728d;
    border-radius:20px;

    box-shadow:0 15px 40px rgba(0,0,0,.5);
}

.card h2{
    margin:0 0 10px;
    font-size:clamp(28px,5vw,42px);
}

.card p{
    color:#b9d3df;
    margin-bottom:20px;
}

.restart{
    border:0;
    border-radius:12px;

    padding:13px 22px;

    background:#12c8ee;
    color:#03141f;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;
}

/* MOBILE BUTTONS */

.mobile-controls{
    display:flex;
    justify-content:center;
    gap:12px;

    margin-top:12px;
}

.control{
    width:75px;
    height:48px;

    border:1px solid #1b6c84;
    border-radius:12px;

    background:#123b4c;
    color:white;

    font-size:23px;
    font-weight:bold;

    touch-action:none;
    user-select:none;
}

.instructions{
    text-align:center;

    color:#8fb5c5;

    font-size:13px;

    margin-top:10px;
}

/* DESKTOP */

@media(min-width:900px){

    .mobile-controls{
        display:none;
    }

}

/* MOBILE */

@media(max-width:899px){

    .page{
        padding:10px 8px 18px;
    }

    .subtitle{
        font-size:12px;
        margin-bottom:8px;
    }

    .game{
        border-radius:14px;
    }

    .hud{
        top:7px;
        left:7px;
        right:7px;
    }

    .hud-item{
        padding:5px 8px;
        font-size:12px;
    }

}

/* SMALL PHONES */

@media(max-width:480px){

    .brand{
        font-size:23px;
    }

    .control{
        width:68px;
        height:44px;
    }

    .instructions{
        font-size:11px;
    }

}
</style>
</head>

<body>

<div class="page">

    <div class="brand">
        GAME<span>VOLTX</span>
    </div>

    <div class="subtitle">
        🌊 Sea Love Breakout • Break the blocks and clear every level
    </div>

    <div class="game-container">

        <div class="game">

            <canvas id="game"
                    width="960"
                    height="540">
            </canvas>

            <div class="hud">

                <div class="hud-item">
                    ❤️ <span id="lives">3</span>
                </div>

                <div class="hud-item">
                    ⭐ <span id="score">0</span>
                </div>

                <div class="hud-item">
                    🌊 Level <span id="level">1</span>
                </div>

            </div>

            <div id="overlay" class="overlay">

                <div class="card">

                    <h2 id="overlayTitle">
                        Game Over
                    </h2>

                    <p id="overlayText">
                        Final score: 0
                    </p>

                    <button
                        id="restart"
                        class="restart">
                        ↻ Play Again
                    </button>

                </div>

            </div>

        </div>

        <div class="mobile-controls">

            <button
                id="leftBtn"
                class="control">
                ◀
            </button>

            <button
                id="rightBtn"
                class="control">
                ▶
            </button>

        </div>

        <div class="instructions">
            Desktop: ← → or A / D • Mouse also works •
            Mobile: buttons or drag on the game
        </div>

    </div>

</div>


<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;


/* HUD */

const livesText =
    document.getElementById("lives");

const scoreText =
    document.getElementById("score");

const levelText =
    document.getElementById("level");


/* OVERLAY */

const overlay =
    document.getElementById("overlay");

const overlayTitle =
    document.getElementById("overlayTitle");

const overlayText =
    document.getElementById("overlayText");

const restart =
    document.getElementById("restart");


/* GAME DATA */

let score = 0;
let lives = 3;
let level = 1;

let running = true;

let leftPressed = false;
let rightPressed = false;


/* PADDLE */

const paddle = {

    x: W / 2 - 70,

    y: H - 42,

    width: 140,

    height: 14,

    speed: 620

};


/* BALL */

const ball = {

    x: W / 2,

    y: H - 70,

    radius: 9,

    vx: 250,

    vy: -340

};


/* BRICKS */

const rows = 5;
const columns = 10;

const gap = 8;

const brickWidth = 78;
const brickHeight = 22;

const startX =
    (W -
    (columns * brickWidth +
    (columns - 1) * gap)) / 2;

const startY = 78;

let bricks = [];


function createBricks(){

    bricks = [];

    for(let row = 0; row < rows; row++){

        for(let col = 0; col < columns; col++){

            bricks.push({

                x:
                    startX +
                    col *
                    (brickWidth + gap),

                y:
                    startY +
                    row *
                    (brickHeight + gap),

                width:brickWidth,

                height:brickHeight,

                alive:true,

                row:row

            });

        }

    }

}


/* RESET BALL */

function resetBall(){

    ball.x = W / 2;

    ball.y = H - 70;

    ball.vx =
        (Math.random() > .5 ? 1 : -1)
        * (220 + Math.random() * 100);

    ball.vy =
        -(330 + (level - 1) * 30);

}


/* HUD */

function updateHUD(){

    livesText.textContent = lives;

    scoreText.textContent = score;

    levelText.textContent = level;

}


/* START */

function startGame(){

    score = 0;

    lives = 3;

    level = 1;

    paddle.x =
        W / 2 -
        paddle.width / 2;

    createBricks();

    resetBall();

    running = true;

    overlay.classList.remove("show");

    updateHUD();

}


/* NEXT LEVEL */

function nextLevel(){

    level++;

    if(level > 5){

        finishGame(true);

        return;

    }

    createBricks();

    paddle.x =
        W / 2 -
        paddle.width / 2;

    resetBall();

    updateHUD();

}


/* END GAME */

function finishGame(won){

    running = false;

    if(won){

        overlayTitle.textContent =
            "🎉 You Win!";

        overlayText.textContent =
            "All levels cleared • Final score: " +
            score;

    }else{

        overlayTitle.textContent =
            "💔 Game Over";

        overlayText.textContent =
            "Final score: " +
            score +
            " • Level reached: " +
            level;

    }

    overlay.classList.add("show");

}


/* LIMIT PADDLE */

function limitPaddle(){

    if(paddle.x < 0)
        paddle.x = 0;

    if(paddle.x +
       paddle.width > W)

        paddle.x =
            W - paddle.width;

}


/* COLLISION */

function collision(ball,rect){

    const closestX =
        Math.max(
            rect.x,
            Math.min(
                ball.x,
                rect.x + rect.width
            )
        );

    const closestY =
        Math.max(
            rect.y,
            Math.min(
                ball.y,
                rect.y + rect.height
            )
        );

    const dx =
        ball.x - closestX;

    const dy =
        ball.y - closestY;

    return (
        dx * dx +
        dy * dy
        <=
        ball.radius *
        ball.radius
    );

}


/* UPDATE */

function update(dt){

    if(!running)
        return;


    /* PADDLE */

    if(leftPressed)
        paddle.x -=
            paddle.speed * dt;

    if(rightPressed)
        paddle.x +=
            paddle.speed * dt;

    limitPaddle();


    /* BALL */

    ball.x += ball.vx * dt;

    ball.y += ball.vy * dt;


    /* WALLS */

    if(ball.x - ball.radius < 0){

        ball.x =
            ball.radius;

        ball.vx =
            Math.abs(ball.vx);

    }


    if(ball.x + ball.radius > W){

        ball.x =
            W - ball.radius;

        ball.vx =
            -Math.abs(ball.vx);

    }


    if(ball.y - ball.radius < 0){

        ball.y =
            ball.radius;

        ball.vy =
            Math.abs(ball.vy);

    }


    /* PADDLE */

    if(
        collision(ball,paddle) &&
        ball.vy > 0
    ){

        ball.y =
            paddle.y -
            ball.radius;

        const hit =
            (
                ball.x -
                (
                    paddle.x +
                    paddle.width / 2
                )
            ) /
            (paddle.width / 2);

        const speed =
            Math.min(
                620,
                Math.hypot(
                    ball.vx,
                    ball.vy
                ) * 1.015
            );

        ball.vx =
            hit * speed * .85;

        ball.vy =
            -Math.sqrt(
                Math.max(
                    120 * 120,
                    speed * speed -
                    ball.vx * ball.vx
                )
            );

    }


    /* BRICKS */

    for(const brick of bricks){

        if(!brick.alive)
            continue;

        if(collision(ball,brick)){

            brick.alive = false;

            score += 10;

            updateHUD();

            ball.vy *= -1;

            break;

        }

    }


    /* LEVEL COMPLETE */

    if(
        bricks.every(
            brick => !brick.alive
        )
    ){

        nextLevel();

        return;

    }


    /* LOST BALL */

    if(
        ball.y -
        ball.radius >
        H
    ){

        lives--;

        updateHUD();

        if(lives <= 0){

            finishGame(false);

        }else{

            paddle.x =
                W / 2 -
                paddle.width / 2;

            resetBall();

        }

    }

}


/* BACKGROUND */

function drawBackground(){

    const gradient =
        ctx.createLinearGradient(
            0,0,0,H
        );

    gradient.addColorStop(
        0,
        "#073244"
    );

    gradient.addColorStop(
        1,
        "#03141f"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* OCEAN LINES */

    ctx.strokeStyle =
        "rgba(100,210,235,.08)";

    ctx.lineWidth = 3;

    for(
        let x = -200;
        x < W + 300;
        x += 150
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(
            x + 120,
            H
        );

        ctx.stroke();

    }


    /* BUBBLES */

    ctx.strokeStyle =
        "rgba(120,225,245,.15)";

    ctx.lineWidth = 2;

    for(
        let i = 0;
        i < 22;
        i++
    ){

        const x =
            (i * 137 + 40) % W;

        const y =
            (i * 83 + 150) % H;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            5 + (i % 4) * 3,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    }

}


/* ROUNDED RECTANGLE */

function roundedRect(
    x,y,w,h,r
){

    ctx.beginPath();

    ctx.moveTo(
        x+r,
        y
    );

    ctx.arcTo(
        x+w,
        y,
        x+w,
        y+h,
        r
    );

    ctx.arcTo(
        x+w,
        y+h,
        x,
        y+h,
        r
    );

    ctx.arcTo(
        x,
        y+h,
        x,
        y,
        r
    );

    ctx.arcTo(
        x,
        y,
        x+w,
        y,
        r
    );

    ctx.closePath();

}


/* BRICKS */

function drawBricks(){

    const colors = [

        ["#40e1c1","#0eaa91"],

        ["#42c7dc","#168ba5"],

        ["#55a9ef","#2772bd"],

        ["#5e70e9","#3439b6"],

        ["#704fe9","#3522c4"]

    ];


    for(const brick of bricks){

        if(!brick.alive)
            continue;

        const color =
            colors[brick.row];

        const gradient =
            ctx.createLinearGradient(
                0,
                brick.y,
                0,
                brick.y +
                brick.height
            );

        gradient.addColorStop(
            0,
            color[0]
        );

        gradient.addColorStop(
            1,
            color[1]
        );

        ctx.fillStyle =
            gradient;

        roundedRect(
            brick.x,
            brick.y,
            brick.width,
            brick.height,
            8
        );

        ctx.fill();

    }

}


/* PADDLE */

function drawPaddle(){

    const gradient =
        ctx.createLinearGradient(
            0,
            paddle.y,
            0,
            paddle.y +
            paddle.height
        );

    gradient.addColorStop(
        0,
        "#eafaff"
    );

    gradient.addColorStop(
        1,
        "#718893"
    );

    ctx.fillStyle =
        gradient;

    roundedRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height,
        7
    );

    ctx.fill();

}


/* BALL */

function drawBall(){

    const glow =
        ctx.createRadialGradient(
            ball.x,
            ball.y,
            1,
            ball.x,
            ball.y,
            ball.radius * 3
        );

    glow.addColorStop(
        0,
        "rgba(255,255,255,.9)"
    );

    glow.addColorStop(
        .3,
        "rgba(255,105,180,.7)"
    );

    glow.addColorStop(
        1,
        "rgba(255,105,180,0)"
    );

    ctx.fillStyle =
        glow;

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius * 3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
        "#ff6eb5";

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* DRAW */

function draw(){

    drawBackground();

    drawBricks();

    drawPaddle();

    drawBall();

}


/* GAME LOOP */

let lastTime = 0;

function gameLoop(time){

    const dt =
        Math.min(
            .025,
            (time - lastTime) / 1000 || 0
        );

    lastTime = time;

    update(dt);

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "ArrowLeft" ||
            e.key === "a" ||
            e.key === "A"
        ){

            leftPressed = true;

            e.preventDefault();

        }


        if(
            e.key === "ArrowRight" ||
            e.key === "d" ||
            e.key === "D"
        ){

            rightPressed = true;

            e.preventDefault();

        }

    }
);


document.addEventListener(
    "keyup",
    function(e){

        if(
            e.key === "ArrowLeft" ||
            e.key === "a" ||
            e.key === "A"
        ){

            leftPressed = false;

        }


        if(
            e.key === "ArrowRight" ||
            e.key === "d" ||
            e.key === "D"
        ){

            rightPressed = false;

        }

    }
);


/* MOBILE BUTTONS */

function buttonControl(
    button,
    direction
){

    button.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            if(direction === "left")
                leftPressed = true;

            if(direction === "right")
                rightPressed = true;

        }
    );


    ["pointerup",
     "pointercancel",
     "pointerleave"].forEach(
        eventName => {

            button.addEventListener(
                eventName,
                function(){

                    if(direction === "left")
                        leftPressed = false;

                    if(direction === "right")
                        rightPressed = false;

                }
            );

        }
    );

}


buttonControl(
    document.getElementById("leftBtn"),
    "left"
);

buttonControl(
    document.getElementById("rightBtn"),
    "right"
);


/* DRAG ON MOBILE */

let dragging = false;

canvas.addEventListener(
    "pointerdown",
    function(e){

        dragging = true;

        canvas.setPointerCapture(
            e.pointerId
        );

    }
);


canvas.addEventListener(
    "pointerup",
    function(){

        dragging = false;

    }
);


canvas.addEventListener(
    "pointercancel",
    function(){

        dragging = false;

    }
);


canvas.addEventListener(
    "pointermove",
    function(e){

        if(
            !dragging ||
            !running
        )
            return;

        const rect =
            canvas.getBoundingClientRect();

        const scale =
            W / rect.width;

        const x =
            (e.clientX -
             rect.left) *
            scale;

        paddle.x =
            x -
            paddle.width / 2;

        limitPaddle();

    }
);


/* RESTART */

restart.addEventListener(
    "click",
    startGame
);


/* START */

startGame();

requestAnimationFrame(
    gameLoop
);

</script>

</body>
</html>
