<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Sea Love Breakout</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #061923;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#gameWrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 1200px;
    max-height: 900px;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 20%, #174d68 0%, #092b3a 45%, #04151d 100%);
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}

/* TOP INFORMATION */

#topBar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 12px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
    font-size: clamp(14px, 2vw, 21px);
    font-weight: bold;
    z-index: 5;
    pointer-events: none;
}

.stat {
    background: rgba(0,0,0,.30);
    padding: 7px 12px;
    border-radius: 20px;
    backdrop-filter: blur(5px);
}

/* CENTER MESSAGE */

#message {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(90%, 500px);
    padding: 25px;
    text-align: center;
    color: white;
    background: rgba(0, 20, 30, .82);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 22px;
    box-shadow: 0 15px 50px rgba(0,0,0,.5);
    z-index: 10;
}

#message h1 {
    font-size: clamp(28px, 6vw, 52px);
    margin-bottom: 10px;
}

#message p {
    font-size: clamp(14px, 3vw, 18px);
    opacity: .9;
    margin-bottom: 20px;
    line-height: 1.5;
}

button {
    border: none;
    outline: none;
    cursor: pointer;
    color: white;
    font-size: 16px;
    font-weight: bold;
    padding: 12px 25px;
    border-radius: 30px;
    background: linear-gradient(135deg, #ff5f9e, #ff3366);
    box-shadow: 0 7px 20px rgba(255, 51, 102, .35);
}

button:active {
    transform: scale(.96);
}

#pauseBtn {
    position: absolute;
    right: 15px;
    bottom: 15px;
    z-index: 8;
    padding: 9px 16px;
    font-size: 13px;
    background: rgba(0,0,0,.45);
    box-shadow: none;
}

/* MOBILE */

@media (max-width: 600px) {

    #topBar {
        padding: 8px;
    }

    .stat {
        padding: 5px 8px;
        font-size: 13px;
    }

    #message {
        padding: 20px 15px;
        border-radius: 18px;
    }

    #pauseBtn {
        bottom: 10px;
        right: 10px;
        padding: 8px 13px;
    }
}
</style>
</head>

<body>

<div id="gameWrapper">

    <canvas id="game"></canvas>

    <div id="topBar">
        <div class="stat">❤️ <span id="lives">3</span></div>
        <div class="stat">⭐ <span id="score">0</span></div>
        <div class="stat">🌊 Level <span id="level">1</span></div>
    </div>

    <div id="message">
        <h1>🌊 Sea Love Breakout 💙</h1>

        <p>
            Break all the sea blocks and keep the ball alive!
            <br><br>
            Desktop: Move with mouse or ← → keys.
            <br>
            Mobile: Touch and drag.
        </p>

        <button id="startBtn">START GAME</button>
    </div>

    <button id="pauseBtn">⏸ Pause</button>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const wrapper = document.getElementById("gameWrapper");

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const levelEl = document.getElementById("level");

const message = document.getElementById("message");
const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");

let W = 800;
let H = 600;

let gameRunning = false;
let paused = false;

let score = 0;
let lives = 3;
let level = 1;

let animationId;

const paddle = {
    x: 350,
    y: 540,
    width: 110,
    height: 15,
    speed: 8
};

const ball = {
    x: 400,
    y: 500,
    radius: 8,
    speed: 5,
    dx: 4,
    dy: -4
};

let bricks = [];

let keys = {};

let particles = [];

let bubbles = [];


// --------------------------------------------------
// RESIZE
// --------------------------------------------------

function resizeCanvas() {

    const rect = wrapper.getBoundingClientRect();

    W = rect.width;
    H = rect.height;

    canvas.width = W;
    canvas.height = H;

    paddle.y = H - Math.max(70, H * 0.10);

    paddle.width = Math.min(130, W * 0.18);

    if (!gameRunning) {
        paddle.x = W / 2 - paddle.width / 2;

        ball.x = W / 2;
        ball.y = paddle.y - 30;
    }
}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();


// --------------------------------------------------
// BACKGROUND BUBBLES
// --------------------------------------------------

for (let i = 0; i < 35; i++) {

    bubbles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 2 + Math.random() * 6,
        speed: .2 + Math.random() * .7
    });
}


// --------------------------------------------------
// CREATE BRICKS
// --------------------------------------------------

function createBricks() {

    bricks = [];

    const rows = Math.min(5 + level - 1, 8);
    const cols = W < 500 ? 6 : 9;

    const gap = 7;

    const side = W * 0.06;

    const brickWidth =
        (W - side * 2 - gap * (cols - 1)) / cols;

    const brickHeight =
        Math.max(20, Math.min(30, H * 0.04));

    for (let r = 0; r < rows; r++) {

        for (let c = 0; c < cols; c++) {

            bricks.push({
                x: side + c * (brickWidth + gap),
                y: 80 + r * (brickHeight + gap),
                width: brickWidth,
                height: brickHeight,
                alive: true,
                hue: 170 + r * 18
            });

        }

    }
}


// --------------------------------------------------
// RESET BALL
// --------------------------------------------------

function resetBall() {

    ball.x = W / 2;
    ball.y = paddle.y - 30;

    ball.speed = 5 + (level - 1) * .4;

    ball.dx =
        (Math.random() > .5 ? 1 : -1) *
        ball.speed *
        .75;

    ball.dy = -ball.speed;
}


// --------------------------------------------------
// START
// --------------------------------------------------

function startGame() {

    score = 0;
    lives = 3;
    level = 1;

    scoreEl.textContent = score;
    livesEl.textContent = lives;
    levelEl.textContent = level;

    paddle.x = W / 2 - paddle.width / 2;

    createBricks();

    resetBall();

    message.style.display = "none";

    gameRunning = true;
    paused = false;

    pauseBtn.textContent = "⏸ Pause";

    cancelAnimationFrame(animationId);

    gameLoop();
}


// --------------------------------------------------
// NEXT LEVEL
// --------------------------------------------------

function nextLevel() {

    level++;

    levelEl.textContent = level;

    createBricks();

    resetBall();
}


// --------------------------------------------------
// GAME OVER
// --------------------------------------------------

function gameOver() {

    gameRunning = false;

    message.innerHTML = `
        <h1>💔 Game Over</h1>

        <p>
            Your Score: <strong>${score}</strong>
            <br>
            You reached Level ${level}
        </p>

        <button id="restartBtn">
            🔄 PLAY AGAIN
        </button>
    `;

    message.style.display = "block";

    document.getElementById("restartBtn")
        .addEventListener("click", startGame);
}


// --------------------------------------------------
// WIN
// --------------------------------------------------

function winGame() {

    gameRunning = false;

    message.innerHTML = `
        <h1>🌊 You Won! 💙</h1>

        <p>
            Amazing!
            <br>
            Score: <strong>${score}</strong>
            <br>
            Level ${level}
        </p>

        <button id="restartBtn">
            🔄 PLAY AGAIN
        </button>
    `;

    message.style.display = "block";

    document.getElementById("restartBtn")
        .addEventListener("click", startGame);
}


// --------------------------------------------------
// KEYBOARD
// --------------------------------------------------

document.addEventListener("keydown", e => {

    keys[e.key] = true;

    if (e.key === " " && gameRunning) {

        paused = !paused;

        pauseBtn.textContent =
            paused ? "▶ Resume" : "⏸ Pause";
    }
});

document.addEventListener("keyup", e => {

    keys[e.key] = false;
});


// --------------------------------------------------
// MOUSE
// --------------------------------------------------

canvas.addEventListener("mousemove", e => {

    if (!gameRunning) return;

    const rect = canvas.getBoundingClientRect();

    const mouseX =
        e.clientX - rect.left;

    paddle.x =
        mouseX - paddle.width / 2;

    keepPaddleInside();
});


// --------------------------------------------------
// TOUCH
// --------------------------------------------------

canvas.addEventListener("touchmove", e => {

    if (!gameRunning) return;

    e.preventDefault();

    const rect = canvas.getBoundingClientRect();

    const touch =
        e.touches[0];

    const touchX =
        touch.clientX - rect.left;

    paddle.x =
        touchX - paddle.width / 2;

    keepPaddleInside();

}, { passive: false });


// --------------------------------------------------
// PADDLE
// --------------------------------------------------

function keepPaddleInside() {

    if (paddle.x < 0)
        paddle.x = 0;

    if (paddle.x + paddle.width > W)
        paddle.x = W - paddle.width;
}


// --------------------------------------------------
// UPDATE
// --------------------------------------------------

function update() {

    if (!gameRunning || paused)
        return;


    // Keyboard controls

    if (keys["ArrowLeft"] || keys["a"]) {

        paddle.x -= paddle.speed;
    }

    if (keys["ArrowRight"] || keys["d"]) {

        paddle.x += paddle.speed;
    }

    keepPaddleInside();


    // Ball

    ball.x += ball.dx;
    ball.y += ball.dy;


    // Wall collision

    if (
        ball.x - ball.radius <= 0 ||
        ball.x + ball.radius >= W
    ) {

        ball.dx *= -1;
    }


    if (ball.y - ball.radius <= 50) {

        ball.dy *= -1;
    }


    // Paddle collision

    if (
        ball.y + ball.radius >= paddle.y &&
        ball.y - ball.radius <=
            paddle.y + paddle.height &&
        ball.x >= paddle.x &&
        ball.x <=
            paddle.x + paddle.width &&
        ball.dy > 0
    ) {

        const hitPosition =
            (ball.x -
            (paddle.x + paddle.width / 2))
            / (paddle.width / 2);

        ball.dx =
            hitPosition * ball.speed;

        ball.dy =
            -Math.abs(
                Math.sqrt(
                    ball.speed * ball.speed -
                    ball.dx * ball.dx
                )
            );

        createParticles(
            ball.x,
            paddle.y,
            5
        );
    }


    // Brick collision

    for (let brick of bricks) {

        if (!brick.alive)
            continue;

        if (
            ball.x + ball.radius > brick.x &&
            ball.x - ball.radius <
                brick.x + brick.width &&
            ball.y + ball.radius > brick.y &&
            ball.y - ball.radius <
                brick.y + brick.height
        ) {

            brick.alive = false;

            score += 10;

            scoreEl.textContent = score;

            ball.dy *= -1;

            createParticles(
                ball.x,
                ball.y,
                10
            );

            break;
        }
    }


    // Level completed

    if (
        bricks.length > 0 &&
        bricks.every(b => !b.alive)
    ) {

        if (level >= 5) {

            winGame();

        } else {

            nextLevel();
        }
    }


    // Ball lost

    if (ball.y - ball.radius > H) {

        lives--;

        livesEl.textContent = lives;

        if (lives <= 0) {

            gameOver();

        } else {

            resetBall();
        }
    }


    updateParticles();

    updateBubbles();
}


// --------------------------------------------------
// DRAW BACKGROUND
// --------------------------------------------------

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0, 0, 0, H
        );

    gradient.addColorStop(
        0,
        "#073b52"
    );

    gradient.addColorStop(
        .5,
        "#07566c"
    );

    gradient.addColorStop(
        1,
        "#031d2b"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    // Light rays

    ctx.globalAlpha = .07;

    ctx.fillStyle = "#ffffff";

    for (let i = 0; i < 6; i++) {

        ctx.beginPath();

        ctx.moveTo(
            W * (.1 + i * .18),
            0
        );

        ctx.lineTo(
            W * (.25 + i * .18),
            H
        );

        ctx.lineTo(
            W * (.38 + i * .18),
            H
        );

        ctx.lineTo(
            W * (.23 + i * .18),
            0
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;


    // Bubbles

    for (let b of bubbles) {

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.r,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            "rgba(255,255,255,.25)";

        ctx.lineWidth = 1;

        ctx.stroke();
    }
}


// --------------------------------------------------
// DRAW BRICKS
// --------------------------------------------------

function drawBricks() {

    for (let brick of bricks) {

        if (!brick.alive)
            continue;

        const gradient =
            ctx.createLinearGradient(
                brick.x,
                brick.y,
                brick.x,
                brick.y + brick.height
            );

        gradient.addColorStop(
            0,
            `hsl(${brick.hue},80%,65%)`
        );

        gradient.addColorStop(
            1,
            `hsl(${brick.hue},80%,38%)`
        );

        ctx.fillStyle = gradient;

        roundRect(
            ctx,
            brick.x,
            brick.y,
            brick.width,
            brick.height,
            8
        );

        ctx.fill();

        ctx.strokeStyle =
            "rgba(255,255,255,.35)";

        ctx.stroke();
    }
}


// --------------------------------------------------
// DRAW PADDLE
// --------------------------------------------------

function drawPaddle() {

    const gradient =
        ctx.createLinearGradient(
            paddle.x,
            paddle.y,
            paddle.x,
            paddle.y + paddle.height
        );

    gradient.addColorStop(
        0,
        "#ff8fbd"
    );

    gradient.addColorStop(
        1,
        "#ff367b"
    );

    ctx.fillStyle = gradient;

    roundRect(
        ctx,
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height,
        10
    );

    ctx.fill();

    ctx.strokeStyle =
        "rgba(255,255,255,.7)";

    ctx.stroke();
}


// --------------------------------------------------
// DRAW BALL
// --------------------------------------------------

function drawBall() {

    const gradient =
        ctx.createRadialGradient(
            ball.x - 3,
            ball.y - 3,
            1,
            ball.x,
            ball.y,
            ball.radius
        );

    gradient.addColorStop(
        0,
        "#ffffff"
    );

    gradient.addColorStop(
        .35,
        "#ffd6e8"
    );

    gradient.addColorStop(
        1,
        "#ff4d91"
    );

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


// --------------------------------------------------
// PARTICLES
// --------------------------------------------------

function createParticles(x, y, count) {

    for (let i = 0; i < count; i++) {

        particles.push({

            x,
            y,

            dx:
                (Math.random() - .5) * 5,

            dy:
                (Math.random() - .5) * 5,

            life: 30
        });
    }
}

function updateParticles() {

    for (let p of particles) {

        p.x += p.dx;
        p.y += p.dy;

        p.life--;
    }

    particles =
        particles.filter(
            p => p.life > 0
        );
}

function drawParticles() {

    for (let p of particles) {

        ctx.globalAlpha =
            p.life / 30;

        ctx.fillStyle =
            "#ffffff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            2,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}


// --------------------------------------------------
// BUBBLES
// --------------------------------------------------

function updateBubbles() {

    for (let b of bubbles) {

        b.y -= b.speed;

        if (b.y < -10) {

            b.y = H + 10;

            b.x =
                Math.random() * W;
        }
    }
}


// --------------------------------------------------
// UTILITY
// --------------------------------------------------

function roundRect(
    context,
    x,
    y,
    width,
    height,
    radius
) {

    context.beginPath();

    context.moveTo(
        x + radius,
        y
    );

    context.lineTo(
        x + width - radius,
        y
    );

    context.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    context.lineTo(
        x + width,
        y + height - radius
    );

    context.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    context.lineTo(
        x + radius,
        y + height
    );

    context.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    context.lineTo(
        x,
        y + radius
    );

    context.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    context.closePath();
}


// --------------------------------------------------
// DRAW
// --------------------------------------------------

function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawBackground();

    drawBricks();

    drawPaddle();

    drawBall();

    drawParticles();


    if (paused && gameRunning) {

        ctx.fillStyle =
            "rgba(0,0,0,.45)";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.font =
            "bold 35px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            "PAUSED",
            W / 2,
            H / 2
        );
    }
}


// --------------------------------------------------
// GAME LOOP
// --------------------------------------------------

function gameLoop() {

    update();

    draw();

    animationId =
        requestAnimationFrame(
            gameLoop
        );
}


// --------------------------------------------------
// PAUSE
// --------------------------------------------------

pauseBtn.addEventListener(
    "click",
    () => {

        if (!gameRunning)
            return;

        paused = !paused;

        pauseBtn.textContent =
            paused
                ? "▶ Resume"
                : "⏸ Pause";
    }
);


// --------------------------------------------------
// START BUTTON
// --------------------------------------------------

startBtn.addEventListener(
    "click",
    startGame
);


// --------------------------------------------------
// INITIAL DRAW
// --------------------------------------------------

createBricks();

draw();

</script>

</body>
</html>
