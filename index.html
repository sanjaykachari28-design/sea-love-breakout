<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Sea Love Breakout ♥ PLAY ONLINE</title>

<script src="processing.min.js"></script>

<style>

html, body {
  margin: 0;
  padding: 0;
  background: #000;
  color: white;
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
}

.game-wrapper {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  touch-action: none;
}

canvas {
  max-width: 100%;
  height: auto !important;
  display: block;
  touch-action: none;
}

</style>

</head>

<body>

<div class="game-wrapper">

<canvas
  id="gameCanvas"
  data-processing-sources="sea_love_breakout.pde">
</canvas>

</div>

<script>

const canvas = document.getElementById("gameCanvas");

canvas.addEventListener("touchstart", function(e) {
  e.preventDefault();
}, {passive:false});

canvas.addEventListener("touchmove", function(e) {

  e.preventDefault();

  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();

  const scaleX = canvas.width / rect.width;

  const x = (touch.clientX - rect.left) * scaleX;

  const event = new MouseEvent("mousemove", {
    bubbles: true,
    cancelable: true,
    clientX: touch.clientX,
    clientY: touch.clientY
  });

  canvas.dispatchEvent(event);

}, {passive:false});

canvas.addEventListener("touchend", function(e) {
  e.preventDefault();
}, {passive:false});

</script>

</body>
</html>
