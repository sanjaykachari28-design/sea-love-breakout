<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sea Love Breakout ♥ PLAY ONLINE</title>
<script src="processing.min.js"></script>
<style>
html,body{margin:0;padding:0;background:#000;color:#fff;width:100%;min-height:100%;overflow-x:hidden}
.game-wrapper{width:100%;display:flex;justify-content:center;align-items:center;box-sizing:border-box}
.game-frame{width:min(750px,100vw);aspect-ratio:750/530;max-height:calc(100vh - 75px);overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
#gameCanvas{display:block;width:100%!important;height:auto!important;max-width:750px;max-height:calc(100vh - 75px);touch-action:none}
@media(max-width:600px){.game-frame{width:100vw;max-height:calc(100vh - 55px)}#gameCanvas{max-height:calc(100vh - 55px)}}
</style>
</head>
<body>
<div class="game-wrapper"><div class="game-frame"><canvas id="gameCanvas" data-processing-sources="sea_love_breakout.pde"></canvas></div></div>
<script>
(function(){
 const c=document.getElementById('gameCanvas');
 function mouse(type,x,y){c.dispatchEvent(new MouseEvent(type,{bubbles:true,cancelable:true,clientX:x,clientY:y,view:window}));}
 c.addEventListener('touchstart',e=>{e.preventDefault();let t=e.touches[0];mouse('mousemove',t.clientX,t.clientY);mouse('mousedown',t.clientX,t.clientY);},{passive:false});
 c.addEventListener('touchmove',e=>{e.preventDefault();let t=e.touches[0];mouse('mousemove',t.clientX,t.clientY);},{passive:false});
 c.addEventListener('touchend',e=>{e.preventDefault();let t=e.changedTouches[0];mouse('mouseup',t.clientX,t.clientY);},{passive:false});
})();
</script>
</body>
</html>
