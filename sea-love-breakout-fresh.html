<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sea Love Breakout</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#06111d;color:#fff;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh;display:flex;justify-content:center}.wrap{width:min(1100px,100%);padding:18px 14px 28px}.header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}.logo{font-size:clamp(22px,4vw,34px);font-weight:900;letter-spacing:-1px}.logo span{color:#18d7ff}.badge{font-size:12px;color:#8fb8ca;border:1px solid #1e3a4b;border-radius:999px;padding:7px 10px}.game-card{background:#091a2a;border:1px solid #17384b;border-radius:18px;padding:12px;box-shadow:0 12px 40px rgba(0,0,0,.35)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 10px;flex-wrap:wrap}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#0d2638;border:1px solid #1a4257;border-radius:10px;padding:7px 10px;font-size:13px}.stat b{color:#19d9ff}button{font:inherit;border:0;cursor:pointer}.btn{background:#13cbe9;color:#00131a;font-weight:800;border-radius:10px;padding:9px 13px}.btn.secondary{background:#153448;color:#d8f8ff;border:1px solid #28556a}.stage{position:relative;width:100%;display:flex;justify-content:center}canvas{display:block;width:100%;height:auto;max-width:100%;background:#000;border-radius:14px;border:1px solid #153b50;touch-action:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:rgba(2,10,18,.58);border-radius:14px}.panel{max-width:420px;background:rgba(5,24,38,.95);border:1px solid #28627b;border-radius:18px;padding:22px;box-shadow:0 15px 45px rgba(0,0,0,.5)}.panel h1{margin:0 0 8px;font-size:clamp(25px,6vw,40px)}.panel p{color:#a9cad6;line-height:1.5;margin:8px 0 16px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.control{min-height:52px;background:#102f43;color:#e8fbff;border:1px solid #275a70;border-radius:12px;font-size:20px;font-weight:900;user-select:none;-webkit-user-select:none;touch-action:none}.control:active{transform:scale(.98);background:#17445c}.hint{text-align:center;color:#7799a8;font-size:12px;margin-top:10px}@media (min-width:800px){.controls{max-width:420px;margin:12px auto 0;grid-template-columns:1fr 1fr}.control{min-height:46px}}@media (max-width:560px){.wrap{padding:8px 8px 18px}.game-card{padding:8px;border-radius:14px}.header{margin-bottom:8px}.badge{display:none}.stat{padding:6px 8px;font-size:12px}.btn{padding:8px 10px}.panel{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
<div class="header"><div class="logo">SEA<span>LOVE</span> BREAKOUT</div><div class="badge">Desktop + Mobile</div></div>
<div class="game-card">
<div class="topbar"><div class="stats"><div class="stat">❤️ Lives: <b id="lives">3</b></div><div class="stat">⭐ Score: <b id="score">0</b></div><div class="stat">🏆 Level: <b id="level">1</b></div></div><button class="btn secondary" id="pauseBtn">Pause</button></div>
<div class="stage"><canvas id="game" width="960" height="560"></canvas><div class="overlay" id="overlay"><div class="panel"><h1>🌊 Sea Love Breakout 💙</h1><p>Break every heart-shaped sea block and keep the ball in play.</p><button class="btn" id="startBtn">▶ Start Game</button><p style="font-size:12px">Desktop: ← → or A / D • Mobile: use the buttons below</p></div></div></div>
<div class="controls"><button class="control" id="leftBtn">◀ LEFT</button><button class="control" id="rightBtn">RIGHT ▶</button></div>
<div class="hint">Tip: move the paddle under the ball. Clear all blocks to advance.</div>
</div></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
const livesEl=document.getElementById('lives'),scoreEl=document.getElementById('score'),levelEl=document.getElementById('level'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn'),pauseBtn=document.getElementById('pauseBtn');
let running=false,paused=false,raf=0,last=0,score=0,lives=3,level=1;const keys={left:false,right:false};
const paddle={w:150,h:18,x:405,y:H-48,speed:620};const ball={x:W/2,y:H-85,r:10,vx:260,vy:-360};let blocks=[];
function heartPath(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.28);ctx.bezierCurveTo(x-s*.55,y-s*.05,x-s*.55,y-s*.55,x,y-s*.12);ctx.bezierCurveTo(x+s*.55,y-s*.55,x+s*.55,y-s*.05,x,y+s*.28);ctx.closePath()}
function makeBlocks(){blocks=[];const cols=Math.min(10,6+level),rows=Math.min(6,3+Math.floor((level-1)/2)),gap=10,margin=48,bw=(W-margin*2-gap*(cols-1))/cols,bh=34;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)blocks.push({x:margin+c*(bw+gap),y:62+r*(bh+gap),w:bw,h:bh,alive:true})}
function resetBall(){ball.x=W/2;ball.y=H-85;const speed=360+level*25;ball.vx=(Math.random()<.5?-1:1)*(220+Math.random()*100);ball.vy=-speed;paddle.x=W/2-paddle.w/2}
function updateUI(){livesEl.textContent=lives;scoreEl.textContent=score;levelEl.textContent=level}
function resetGame(){score=0;lives=3;level=1;makeBlocks();resetBall();updateUI()}
function start(){resetGame();running=true;paused=false;overlay.style.display='none';pauseBtn.textContent='Pause';last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function end(title){running=false;paused=false;cancelAnimationFrame(raf);overlay.style.display='flex';overlay.querySelector('h1').textContent=title;overlay.querySelector('p').textContent='Score: '+score+' • Level: '+level;startBtn.textContent='↻ Play Again';pauseBtn.textContent='Pause'}
function togglePause(){if(!running)return;paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause';if(!paused){last=performance.now();raf=requestAnimationFrame(loop)}}
function movePaddle(dt){if(keys.left)paddle.x-=paddle.speed*dt;if(keys.right)paddle.x+=paddle.speed*dt;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x))}
function circleRect(cx,cy,r,rx,ry,rw,rh){const nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh)),dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<r*r}
function update(dt){movePaddle(dt);ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x+ball.r>W){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}if(ball.y-ball.r>H){lives--;updateUI();if(lives<=0){end('💔 Game Over');return}resetBall();return}
if(circleRect(ball.x,ball.y,ball.r,paddle.x,paddle.y,paddle.w,paddle.h)&&ball.vy>0){const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*430;ball.vy=-Math.abs(ball.vy)*1.02;ball.y=paddle.y-ball.r-1}
for(const b of blocks)if(b.alive&&circleRect(ball.x,ball.y,ball.r,b.x,b.y,b.w,b.h)){b.alive=false;score+=10;updateUI();ball.vy*=-1;break}
if(blocks.every(b=>!b.alive)){level++;if(level>6){end('🏆 You Win!');return}makeBlocks();resetBall();updateUI()}}
function draw(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#031a2a');g.addColorStop(1,'#00070d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<26;i++){const x=(i*137)%W,y=(i*83+(performance.now()/35)*(i%3+1))%H;ctx.globalAlpha=.12;ctx.strokeStyle='#7de7ff';ctx.beginPath();ctx.arc(x,y,3+(i%4),0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1;
for(const b of blocks)if(b.alive){ctx.fillStyle='#0b5f7d';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeStyle='#36dfff';ctx.strokeRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#ff6fae';heartPath(b.x+b.w/2,b.y+b.h/2,Math.min(b.w*.25,b.h*.8));ctx.fill()}
ctx.fillStyle='#18d7ff';ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);ctx.fillStyle='#dffbff';ctx.fillRect(paddle.x+18,paddle.y+4,paddle.w-36,3);const bg=ctx.createRadialGradient(ball.x-3,ball.y-3,1,ball.x,ball.y,ball.r);bg.addColorStop(0,'#fff');bg.addColorStop(1,'#18d7ff');ctx.fillStyle=bg;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='bold 13px Arial';ctx.fillText('SEA LOVE',18,H-16)}
function loop(t){if(!running)return;if(!paused){const dt=Math.min((t-last)/1000,.025);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}}
function bindHold(el,dir){const on=e=>{e.preventDefault();keys[dir]=true},off=e=>{e.preventDefault();keys[dir]=false};['pointerdown','touchstart'].forEach(e=>el.addEventListener(e,on,{passive:false}));['pointerup','pointercancel','pointerleave','touchend'].forEach(e=>el.addEventListener(e,off,{passive:false}))}
bindHold(document.getElementById('leftBtn'),'left');bindHold(document.getElementById('rightBtn'),'right');
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a'){keys.left=true;e.preventDefault()}if(e.key==='ArrowRight'||e.key.toLowerCase()==='d'){keys.right=true;e.preventDefault()}if(e.key===' '){e.preventDefault();togglePause()}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false});
startBtn.addEventListener('click',start);pauseBtn.addEventListener('click',togglePause);resetGame();draw();
})();
</script>
</body>
</html>
